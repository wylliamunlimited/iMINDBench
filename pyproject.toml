[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "imindbench"
version = "0.1.0"
description = "Reproducible evaluation workflows for public intracranial neural decoding benchmarks"
readme = "README.md"
# Hydra 1.3.2's CLI is incompatible with Python 3.14.
requires-python = ">=3.10,<3.14"
license-files = [
    "LICENSE.txt",
    "THIRD_PARTY.md",
    "LICENSES/BaRISTA-LICENSE.md",
    "LICENSES/DIVER-1-LICENSE.txt",
    "LICENSES/uni2ts-LICENSE.txt",
    "LICENSES/PyTorch-LICENSE.txt",
    "LICENSES/PopT-LICENSE.txt",
    "LICENSES/SciPy-LICENSE.txt",
]
dependencies = [
    "einops>=0.8,<0.9",
    "hydra-core==1.3.2",
    "mne>=1.10,<1.12",
    "numpy>=1.26,<3",
    "omegaconf==2.3.0",
    "psutil>=5.9,<8",
    "scikit-learn>=1.6,<2",
    "scipy>=1.11,<2",
    "threadpoolctl>=3.2,<4",
    "torch==2.9.1",
]

[project.optional-dependencies]
barista = ["xformers==0.0.33.post2"]
diver = ["mup==1.0.0", "jaxtyping>=0.3,<0.4"]
warmup = ["warmup-scheduler @ git+https://github.com/ildoonet/pytorch-gradual-warmup-lr.git@7021d63a49106e22c79b40564a7d39930e7b0f53"]
models = ["imindbench[barista,diver,warmup]==0.1.0"]
logging = ["wandb>=0.21,<0.25"]
test = ["pytest>=7.2,<9"]
dev = ["pytest>=7.2,<9", "ruff==0.15.10", "build>=1.2,<2"]

[project.scripts]
imindbench = "imindbench.run_eval:cli"
imindbench-grid = "imindbench.launch:main"

[tool.setuptools.packages.find]
include = ["imindbench*"]

[tool.setuptools.package-data]
imindbench = [
    "conf/**/*.yaml",
    "decodable_subject_sessions/**/*.json",
    "decodable_subject_sessions/**/README.md",
]

[tool.ruff]
target-version = "py310"
extend-exclude = ["build", "*.ipynb"]

[tool.ruff.lint]
select = ["I", "F", "UP", "B", "E"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Jaxtyping tensor-shape strings are not Python forward references.
"imindbench/models/diver_components/*.py" = ["F722"]
