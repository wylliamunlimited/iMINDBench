# Example paths config. Copy outside the installation to <config-dir>/paths/local.yaml
# and select it with --config-dir <config-dir> paths=local.
# Use absolute paths for data, checkpoints and caches.
#
# Only the dataset fields below are needed for the first baseline.
# Optional resources inherit null defaults from conf/config.yaml.

# Root holding the processed brainsets, and the directory name under it.
dataset_root: /path/to/brainsets/processed
dataset_dirname: neuroprobe_2025

# Add only the resources you use, for example:
# popt_checkpoint: /path/to/popt.pt
# brainbert_checkpoint: /path/to/stft_large_pretrained.pth
# barista_checkpoint: /path/to/barista.pt
# diver_checkpoint: /path/to/ieeg_checkpoint.pt
# diver_shape_cache_dir: /path/to/diver_shapes
# train_source_cache_dir: /path/to/train_cache
# preprocessed_split_cache_dir: /path/to/preprocessed_cache
# decodable_subject_sessions_dir: /path/to/population_manifests
# Omni-iEEG (see README, "Omni-iEEG"); its processed omni_ieeg/ and
# omni_ieeg_hfo/ directories live under dataset_root:
# omni_ictal_split_csv: /path/to/Omni-iEEG/omni_ieeg/exploratory_model/ictal_sleep/ictal_split_cross.csv
# omni_sleep_split_csv: /path/to/Omni-iEEG/omni_ieeg/exploratory_model/ictal_sleep/sleep_split_cross.csv
# omni_final_split_csv: /path/to/brainsets/raw/omni_ieeg/derivatives/datasplit/final_split.csv
# omni_anatomical_mapping_csv: /path/to/Omni-iEEG/omni_ieeg/exploratory_model/anatomical/anatomical_mapping.csv
# omni_raw_root: /path/to/brainsets/raw/omni_ieeg
# With training-source caching enabled, null uses the dataset root's
# .neuroprobe_eval_train_source_cache directory.
