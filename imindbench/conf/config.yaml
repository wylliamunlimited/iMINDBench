# Main configuration for benchmark evaluation
defaults:
  - _self_
  - paths: ???
  - dataset: neuroprobev2
  - model: ???
  - preprocessor: ???
  - submitter: default
  - runtime: default
  - experiment: default  # Unfiltered cohort; select decodable for Main cohort/caps.

# Optional resources inherit these defaults when absent from paths/local.yaml.
paths:
  barista_checkpoint: null
  brainbert_checkpoint: null
  popt_checkpoint: null
  diver_checkpoint: null
  diver_shape_cache_dir: null
  train_source_cache_dir: null
  preprocessed_split_cache_dir: null
  decodable_subject_sessions_dir: null

# Regression settings, used only when dataset.label_mode is regression. They are
# declared here so every model accepts --set model.regression_head=... .
#   regression_head: trained_mse trains the model with a mean-squared-error loss;
#     ridge keeps the rest of the model as loaded and solves its final linear
#     layer with ridge regression (linear_baseline, or diver with
#     ft_head_style=flatten_linear). The logistic (sklearn) row always fits a
#     ridge regression with alpha = regression_head_lambda.
#   regression_head_lambda_mode: fixed uses regression_head_lambda; trace uses
#     regression_head_lambda_alpha x (mean feature variance); gcv picks the value
#     in regression_head_lambda_grid with the lowest generalized
#     cross-validation error.
model:
  regression_head: trained_mse
  regression_head_lambda: 1.0
  regression_head_lambda_mode: fixed
  regression_head_lambda_alpha: 1.0
  regression_head_lambda_grid: [3.0e3, 1.0e4, 3.0e4, 1.0e5, 3.0e5]

# Hydra configuration
hydra:
  job:
    chdir: true  # Explicitly set working directory behavior to suppress warning

# Wandb (Weights & Biases) logging configuration
wandb:
  enabled: false  # Remote logging is opt-in.
  project: neuroprobe_eval  # Wandb project name
  entity: null  # Wandb entity/team (null for personal account)
  name: null  # Run name (null for auto-generated)
  tags: null  # Tags as comma-separated string (e.g., "cnn,hp_sweep,onset") or list
  notes: null  # Notes/description for this run
  group: null  # Group runs together (e.g., by HP sweep)
