# Miller ECoG library (2019) with real electrode positions.
#
# Needs the Miller build whose H5 files carry MNI152 positions
# (coord_mni152_x/y/z and coord_mni152_quality per channel). On the build
# without positions, every run with this config fails with a KeyError naming
# the missing frame mni152_strict.
#
# Positions with quality "C" are a fallback, not a real atlas position, so they
# are set to NaN and those channels are dropped. Run this config with the
# positions cell lists (--cells positions_binary or positions_multiclass) so no
# recording loses all its channels.
#
# PopT and BaRISTA use popt_miller below. DIVER's model config replaces it with
# diver_mni, so the run script adds
#   --set dataset.coordinate_profile=diver_mni_miller
# to the DIVER row.
#
# Everything else is the same as millerecog2019.yaml; see that file for the
# task set and subject numbers.
root: ${paths.dataset_root}
dirname: miller_ecog_library_2019
provider: millerecog2019
window_slicing_policy: ceil  # ceil | legacy_floor
subset_tier: full
label_mode: binary  # binary|multiclass|regression (regression: task sets 13-25)
# class_pair: [a, b] keeps only the windows of stored labels a and b of a
# multiclass task and scores them as a binary task, with b as the positive
# class. Needs label_mode: multiclass. null scores the task as usual.
class_pair: null
task: move_vs_rest
test_subject: 3
test_session: 1
regime: within-session  # The only regime: each recording is evaluated on its own.
coordinate_profile: popt_miller  # popt_miller|diver_mni_miller
train_same_subject_only: false
# Fraction of train windows to keep via random subsampling per fold (0, 1].
train_sample_fraction: 1.0
max_train_samples_per_subject: null
decodable_subject_sessions_only: false
brain_area_key: null
destrieux_brain_area_key: label_destrieux  # Selected by BaRISTA.
uniquify_channel_ids_with_subject: true
uniquify_channel_ids_with_session: true
merge_val_into_test: false
# fold_subset: [0] runs only the listed folds; null runs every fold. Task set 25
# (fingerflex_reg_w1000h25b) has only fold 0, so it must be run with [0].
fold_subset: null
# regression_target_last_samples: in regression mode, score only the last N
# samples of each window's 40 Hz trajectory; 0 scores all of them. The sliding
# sets (22-24, 50 ms steps) use 2, so the test windows joined end to end form
# one continuous trajectory; set 25 (25 ms steps) uses 1.
regression_target_last_samples: 0
# Matched train subsets: keep exactly the train windows listed in a JSON file
# instead of all of them. The file is keyed by "<task>_sub<S>_sess<E>_fold<F>";
# _frac and _draw pick one subset, and _order_seed is the seed of the run the
# subsets were computed on. The file stores the number of train windows and a
# checksum of their labels, and the run stops if they do not match. A fold
# whose draw is absent from the file is recorded as skipped. null disables this.
train_sample_indices_file: null
train_sample_indices_frac: null
train_sample_indices_draw: null
train_sample_indices_order_seed: 42
