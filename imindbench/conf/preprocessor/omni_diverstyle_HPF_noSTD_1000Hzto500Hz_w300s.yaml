# Same chain as the w1s/w60s variants, for dataset.provider_options.window_sec=300
# (the upstream Omni-iEEG anatomical-location windows). context_window_sec must
# cover the target window; 330 s leaves 15 s of filter context on each side.
chain:
  - name: context_window
    context_window_sec: 330.0
    sampling_rate: 1000

  - name: time_domain_filter_diver_style
    sampling_rate: 1000
    notch_freqs: [60, 120, 180]

  - name: crop_to_target_window

  - name: resample
    source_rate: 1000
    target_rate: 500
